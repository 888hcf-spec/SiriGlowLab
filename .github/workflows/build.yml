
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

            - name: Build iPhone app
        run: |
          xcodebuild \
            -project SiriGlowLab.xcodeproj \
            -scheme SiriGlowLab \
                        -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SiriGlowLab-Simulator
          path: build/Build/Products/Debug-iphoneos/SiriGlowLab.app