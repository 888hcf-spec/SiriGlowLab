
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project SiriGlowLab.xcodeproj \
            -scheme SiriGlowLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/SiriGlowLab.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到 iPhone 构建产物：$APP_PATH"
            find build/Build/Products -maxdepth 3 -name '*.app' -print
            exit 1
          fi

          rm -rf Payload SiriGlowLab-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry SiriGlowLab-unsigned.ipa Payload

          test -f SiriGlowLab-unsigned.ipa
          ls -lh SiriGlowLab-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SiriGlowLab-unsigned-IPA
          path: SiriGlowLab-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
