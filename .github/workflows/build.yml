
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: find . -maxdepth 4 -type f

      - name: Check Xcode
        run: xcodebuild -version
